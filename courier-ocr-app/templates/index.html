<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#1d4ed8">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Courier OCR</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    * { -webkit-tap-highlight-color: transparent; }
    body { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; overscroll-behavior: none; }
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .spin { animation: spin 0.9s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .slide-up { animation: slideUp 0.25s ease-out; }
    @keyframes slideUp { from { transform: translateY(100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    .card-in { animation: cardIn 0.2s ease-out; }
    @keyframes cardIn { from { opacity: 0; transform: scale(0.97); } to { opacity: 1; transform: scale(1); } }
  </style>
</head>
<body class="bg-slate-100 min-h-screen select-none">

<!-- ══ HEADER ══════════════════════════════════════════════════════════════ -->
<header class="bg-blue-700 text-white sticky top-0 z-20 shadow-lg">
  <div class="flex items-center justify-between px-4 py-3">
    <div class="flex items-center gap-2">
      <svg class="w-6 h-6 opacity-80" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"/>
      </svg>
      <h1 class="text-lg font-bold tracking-tight">Courier OCR</h1>
    </div>
    <div class="flex items-center gap-2">
      <button onclick="App.openZones()"
              class="p-2 rounded-full hover:bg-blue-600 active:bg-blue-800 transition"
              title="Zone">
        <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/>
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/>
        </svg>
      </button>
      <button onclick="App.openScan()"
              class="flex items-center gap-1.5 bg-white text-blue-700 font-bold px-4 py-1.5 rounded-full text-sm active:bg-blue-50 transition shadow">
        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"/>
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"/>
        </svg>
        Scan
      </button>
    </div>
  </div>

  <!-- Zone filter tabs -->
  <div id="zoneTabs" class="flex gap-1.5 px-4 pb-3 overflow-x-auto hide-scrollbar">
    <button onclick="App.setZone(null)" id="tab-all"
            class="flex-shrink-0 text-sm px-3 py-1 rounded-full font-semibold bg-white text-blue-700 transition">
      Toate
    </button>
  </div>
</header>

<!-- ══ MAIN ═════════════════════════════════════════════════════════════════ -->
<main class="max-w-lg mx-auto pb-8 pt-2 px-3">

  <div id="statsBar" class="text-xs text-slate-400 px-1 py-2"></div>

  <div id="cardList" class="space-y-3"></div>

  <div id="empty" class="hidden flex-col items-center justify-center py-24 text-slate-400">
    <svg class="w-16 h-16 mb-4 opacity-50" fill="none" viewBox="0 0 24 24" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.2"
            d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/>
    </svg>
    <p class="font-semibold text-base">Niciun colet</p>
    <p class="text-sm mt-1">Apasă <strong>Scan</strong> pentru a adăuga</p>
  </div>

</main>

<!-- ══ SCAN MODAL ═══════════════════════════════════════════════════════════ -->
<div id="scanModal" class="fixed inset-0 z-50 hidden" aria-modal="true">
  <div class="absolute inset-0 bg-black/60" onclick="App.closeScan()"></div>
  <div class="absolute bottom-0 left-0 right-0 bg-white rounded-t-2xl slide-up max-h-[90vh] overflow-y-auto">
    <div class="flex items-center justify-between px-5 py-4 border-b border-slate-100">
      <h2 class="text-lg font-bold">Scanează PDA</h2>
      <button onclick="App.closeScan()" class="p-1.5 text-slate-400 hover:text-slate-600">
        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
        </svg>
      </button>
    </div>
    <div id="scanBody" class="px-5 py-6"></div>
  </div>
</div>

<!-- ══ ZONE MODAL ═══════════════════════════════════════════════════════════ -->
<div id="zoneModal" class="fixed inset-0 z-50 hidden" aria-modal="true">
  <div class="absolute inset-0 bg-black/60" onclick="App.closeZones()"></div>
  <div class="absolute bottom-0 left-0 right-0 bg-white rounded-t-2xl slide-up max-h-[90vh] overflow-y-auto">
    <div class="flex items-center justify-between px-5 py-4 border-b border-slate-100">
      <h2 class="text-lg font-bold">Gestionează Zone</h2>
      <button onclick="App.closeZones()" class="p-1.5 text-slate-400 hover:text-slate-600">
        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
        </svg>
      </button>
    </div>

    <div class="px-5 py-5 space-y-5">
      <!-- Add zone -->
      <div class="bg-slate-50 rounded-xl p-4 border border-slate-200">
        <p class="text-sm font-semibold text-slate-600 mb-3">Adaugă zonă nouă</p>
        <input id="zName" type="text" placeholder="Nume (ex: Zona 1)"
               class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm mb-2 focus:outline-none focus:ring-2 focus:ring-blue-400"/>
        <input id="zKeyword" type="text" placeholder="Cuvânt cheie din adresă (ex: vasi)"
               class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm mb-3 focus:outline-none focus:ring-2 focus:ring-blue-400"/>
        <button onclick="App.addZone()"
                class="w-full bg-blue-600 text-white font-semibold py-2.5 rounded-lg text-sm active:bg-blue-700 transition">
          + Adaugă zonă
        </button>
        <p class="text-xs text-slate-400 mt-2">Orice adresă care conține cuvântul cheie (case-insensitive) va apărea în această zonă.</p>
      </div>

      <!-- Zone list -->
      <div id="zoneList"></div>
    </div>
  </div>
</div>

<!-- ══ SCRIPT ════════════════════════════════════════════════════════════════ -->
<script>
const ZONE_COLORS = [
  "bg-violet-100 text-violet-700",
  "bg-emerald-100 text-emerald-700",
  "bg-amber-100 text-amber-700",
  "bg-rose-100 text-rose-700",
  "bg-sky-100 text-sky-700",
  "bg-fuchsia-100 text-fuchsia-700",
];

const App = (() => {
  let cards = [];
  let zones = [];
  let activeZone = null;  // zone name or null
  let pendingCards = [];  // cards from last scan, waiting to be added

  // ── Data loading ──────────────────────────────────────────────────────────
  async function load() {
    const [cRes, zRes] = await Promise.all([fetch("/api/cards"), fetch("/api/zones")]);
    cards = await cRes.json();
    zones = await zRes.json();
    renderTabs();
    renderCards();
    renderZoneList();
  }

  // ── Zone tabs ─────────────────────────────────────────────────────────────
  function renderTabs() {
    const container = document.getElementById("zoneTabs");
    container.innerHTML = "";

    const allBtn = _btn("Toate", activeZone === null);
    allBtn.id = "tab-all";
    allBtn.onclick = () => setZone(null);
    container.appendChild(allBtn);

    zones.forEach(z => {
      const b = _btn(z.name, activeZone === z.name);
      b.onclick = () => setZone(z.name);
      container.appendChild(b);
    });
  }

  function _btn(label, active) {
    const b = document.createElement("button");
    b.className = `flex-shrink-0 text-sm px-3 py-1 rounded-full font-semibold transition ${
      active ? "bg-white text-blue-700" : "bg-blue-600 text-white"
    }`;
    b.textContent = label;
    return b;
  }

  function setZone(name) {
    activeZone = name;
    renderTabs();
    renderCards();
  }

  // ── Cards ─────────────────────────────────────────────────────────────────
  function visibleCards() {
    if (!activeZone) return cards;
    const zone = zones.find(z => z.name === activeZone);
    if (!zone) return cards;
    return cards.filter(c =>
      c.address.toLowerCase().includes(zone.keyword.toLowerCase())
    );
  }

  function renderCards() {
    const list = document.getElementById("cardList");
    const empty = document.getElementById("empty");
    const stats = document.getElementById("statsBar");
    const shown = visibleCards();

    const calledCount = shown.filter(c => c.called).length;
    stats.textContent = `${shown.length} colet${shown.length !== 1 ? "e" : ""} · ${calledCount} sunat${calledCount !== 1 ? "e" : ""}`;

    if (shown.length === 0) {
      list.innerHTML = "";
      empty.classList.remove("hidden");
      empty.classList.add("flex");
      return;
    }
    empty.classList.add("hidden");
    empty.classList.remove("flex");
    list.innerHTML = shown.map(cardHTML).join("");
  }

  function cardHTML(c) {
    const zoneBadges = (c.zones || [])
      .map((zn, i) => {
        const colorIdx = zones.findIndex(z => z.name === zn) % ZONE_COLORS.length;
        return `<span class="text-xs px-2 py-0.5 rounded-full font-medium ${ZONE_COLORS[Math.max(0, colorIdx)]}">${esc(zn)}</span>`;
      }).join("");

    const calledBg  = c.called ? "bg-green-50 border-green-200" : "bg-white border-slate-200";
    const callBtnCls = c.called
      ? "bg-green-100 text-green-700 border border-green-200"
      : "bg-amber-100 text-amber-700 border border-amber-200";
    const callBtnTxt = c.called ? "✓ Sunat" : "Nesunat";

    return `
    <div class="card-in rounded-2xl border ${calledBg} shadow-sm overflow-hidden" id="c${c.id}">
      <!-- PDA-style field list -->
      <div class="px-4 pt-4 pb-3 space-y-1.5">

        <!-- AWB -->
        <div class="flex items-baseline gap-2">
          <span class="text-xs font-bold text-slate-400 w-24 shrink-0">AWB:</span>
          <span class="font-mono font-bold text-slate-800 text-sm tracking-wide">${esc(c.awb)}</span>
          ${zoneBadges ? `<div class="flex flex-wrap gap-1 ml-auto">${zoneBadges}</div>` : ""}
        </div>

        <!-- Destinatar -->
        <div class="flex items-baseline gap-2">
          <span class="text-xs font-bold text-slate-400 w-24 shrink-0">Destinatar:</span>
          <span class="text-sm font-semibold text-slate-800">${esc(c.name)}</span>
        </div>

        <!-- Adresa -->
        <div class="flex items-baseline gap-2">
          <span class="text-xs font-bold text-slate-400 w-24 shrink-0">Adresa:</span>
          <span class="text-sm text-slate-600 leading-snug">${esc(c.address)}</span>
        </div>

        <!-- Telefon (tap-to-call) -->
        <div class="flex items-center gap-2">
          <span class="text-xs font-bold text-slate-400 w-24 shrink-0">Telefon:</span>
          <a href="tel:${esc(c.phone)}"
             class="text-sm font-semibold text-blue-600 underline underline-offset-2 active:text-blue-800">
            ${esc(c.phone)}
          </a>
        </div>

      </div>

      <!-- Action bar -->
      <div class="flex gap-2 px-4 pb-4 pt-2">
        <a href="tel:${esc(c.phone)}"
           class="flex-1 flex items-center justify-center gap-1.5 bg-blue-600 text-white py-2.5 rounded-xl font-semibold text-sm active:bg-blue-700 transition">
          <svg class="w-4 h-4 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"/>
          </svg>
          Sună
        </a>
        <button onclick="App.toggleCalled(${c.id})"
                class="px-3 py-2.5 rounded-xl text-sm font-semibold ${callBtnCls} active:opacity-70 transition whitespace-nowrap">
          ${callBtnTxt}
        </button>
        <button onclick="App.removeCard(${c.id})"
                class="p-2.5 rounded-xl bg-red-50 text-red-400 active:bg-red-100 transition border border-red-100">
          <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
          </svg>
        </button>
      </div>
    </div>`;
  }

  async function toggleCalled(id) {
    const res = await fetch(`/api/cards/${id}/called`, { method: "PATCH" });
    const { called } = await res.json();
    const card = cards.find(c => c.id === id);
    if (card) card.called = called;
    renderCards();
  }

  async function removeCard(id) {
    if (!confirm("Ștergi coletul?")) return;
    await fetch(`/api/cards/${id}`, { method: "DELETE" });
    cards = cards.filter(c => c.id !== id);
    renderCards();
  }

  // ── Scan modal ────────────────────────────────────────────────────────────
  function openScan() {
    document.getElementById("scanModal").classList.remove("hidden");
    showScanPicker();
  }
  function closeScan() {
    document.getElementById("scanModal").classList.add("hidden");
  }

  function showScanPicker() {
    document.getElementById("scanBody").innerHTML = `
      <div class="space-y-3">
        <label class="flex flex-col items-center justify-center gap-3 bg-blue-600 text-white rounded-2xl py-7 cursor-pointer active:bg-blue-700 transition">
          <svg class="w-10 h-10 opacity-90" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                  d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"/>
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"/>
          </svg>
          <span class="font-bold text-lg">Fotografiază PDA</span>
          <span class="text-sm opacity-80">Deschide camera</span>
          <input type="file" accept="image/*" capture="environment" class="hidden" onchange="App._onFile(event)">
        </label>

        <label class="flex items-center justify-center gap-2 bg-slate-100 text-slate-700 rounded-2xl py-4 cursor-pointer active:bg-slate-200 transition border border-slate-200">
          <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/>
          </svg>
          <span class="font-semibold text-sm">Selectează din galerie</span>
          <input type="file" accept="image/*" class="hidden" onchange="App._onFile(event)">
        </label>
      </div>
    `;
  }

  async function _onFile(evt) {
    const file = evt.target.files[0];
    if (!file) return;

    document.getElementById("scanBody").innerHTML = `
      <div class="flex flex-col items-center justify-center py-12 gap-4">
        <svg class="spin w-10 h-10 text-blue-600" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/>
          <path class="opacity-75" fill="currentColor"
                d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"/>
        </svg>
        <p class="text-slate-600 font-semibold">Se procesează OCR…</p>
        <p class="text-slate-400 text-sm">Prima rulare poate dura câteva secunde</p>
      </div>`;

    const fd = new FormData();
    fd.append("file", file);

    try {
      const res = await fetch("/api/scan", { method: "POST", body: fd });
      if (!res.ok) throw new Error(await res.text());
      const { cards: found } = await res.json();
      showScanResults(found);
    } catch (e) {
      document.getElementById("scanBody").innerHTML = `
        <div class="text-center py-10">
          <p class="text-red-500 font-semibold mb-2">Eroare la OCR</p>
          <p class="text-slate-400 text-sm mb-5">${esc(e.message)}</p>
          <button onclick="App._showScanPicker()" class="text-blue-600 underline text-sm">Încearcă din nou</button>
        </div>`;
    }
  }

  function showScanResults(found) {
    pendingCards = found.filter(c => !c.exists);
    const dups = found.filter(c => c.exists);

    if (found.length === 0) {
      document.getElementById("scanBody").innerHTML = `
        <div class="text-center py-10">
          <p class="text-slate-600 font-semibold mb-2">Nu s-au detectat colete</p>
          <p class="text-slate-400 text-sm mb-5">Asigură-te că imaginea e clară și conține câmpurile AWB, Nume, Adresă, Telefon.</p>
          <button onclick="App._showScanPicker()" class="bg-blue-600 text-white px-6 py-2 rounded-xl text-sm font-semibold">Încearcă din nou</button>
        </div>`;
      return;
    }

    const cardsHtml = found.map(c => `
      <div class="rounded-xl border p-3 ${c.exists ? "border-slate-200 bg-slate-50 opacity-60" : "border-blue-200 bg-blue-50"}">
        ${c.exists ? '<p class="text-xs text-slate-400 mb-1">⚠ Există deja</p>' : ""}
        <div class="font-mono text-xs text-slate-400 mb-1">AWB: ${esc(c.awb)}</div>
        <div class="font-semibold text-sm text-slate-800">${esc(c.name)}</div>
        <div class="text-xs text-slate-500">${esc(c.address)}</div>
        <div class="text-xs text-blue-600 font-medium mt-0.5">${esc(c.phone)}</div>
      </div>`).join("");

    document.getElementById("scanBody").innerHTML = `
      <div class="space-y-3">
        <p class="text-sm text-slate-500">${found.length} colet${found.length !== 1 ? "e" : ""} detectat${found.length !== 1 ? "e" : ""}${dups.length ? ` (${dups.length} deja există)` : ""}.</p>
        ${cardsHtml}
        ${pendingCards.length > 0
          ? `<button onclick="App._commitCards()"
                     class="w-full bg-green-600 text-white font-bold py-3.5 rounded-2xl text-base active:bg-green-700 transition">
               ✓ Adaugă ${pendingCards.length} colet${pendingCards.length !== 1 ? "e" : ""} noi
             </button>`
          : '<p class="text-center text-sm text-slate-400">Toate coletele există deja.</p>'
        }
        <button onclick="App._showScanPicker()"
                class="w-full text-slate-500 text-sm py-2 underline">
          Scanează altă imagine
        </button>
      </div>`;
  }

  async function _commitCards() {
    const res = await fetch("/api/cards", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ cards: pendingCards }),
    });
    const data = await res.json();
    closeScan();
    await load();
  }

  // ── Zone modal ────────────────────────────────────────────────────────────
  function openZones() {
    document.getElementById("zoneModal").classList.remove("hidden");
  }
  function closeZones() {
    document.getElementById("zoneModal").classList.add("hidden");
  }

  function renderZoneList() {
    const el = document.getElementById("zoneList");
    if (zones.length === 0) {
      el.innerHTML = `<p class="text-center text-sm text-slate-400 py-4">Nicio zonă definită încă.</p>`;
      return;
    }
    el.innerHTML = zones.map((z, i) => `
      <div class="flex items-center justify-between rounded-xl border border-slate-200 bg-slate-50 px-4 py-3">
        <div class="flex items-center gap-2 min-w-0">
          <span class="text-xs px-2 py-0.5 rounded-full font-semibold ${ZONE_COLORS[i % ZONE_COLORS.length]}">${esc(z.name)}</span>
          <span class="text-sm text-slate-500 truncate">adresă conține <strong>${esc(z.keyword)}</strong></span>
        </div>
        <button onclick="App._delZone(${z.id})" class="ml-2 p-1.5 text-slate-400 hover:text-red-500 active:text-red-600 shrink-0">
          <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
          </svg>
        </button>
      </div>`).join("");
  }

  async function addZone() {
    const name = document.getElementById("zName").value.trim();
    const keyword = document.getElementById("zKeyword").value.trim();
    if (!name || !keyword) { alert("Completează ambele câmpuri."); return; }
    const res = await fetch("/api/zones", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ name, keyword }),
    });
    const zone = await res.json();
    zones.push(zone);
    document.getElementById("zName").value = "";
    document.getElementById("zKeyword").value = "";
    renderZoneList();
    renderTabs();
    renderCards();
  }

  async function _delZone(id) {
    const zone = zones.find(z => z.id === id);
    await fetch(`/api/zones/${id}`, { method: "DELETE" });
    zones = zones.filter(z => z.id !== id);
    if (activeZone === zone?.name) activeZone = null;
    renderZoneList();
    renderTabs();
    renderCards();
    // Refresh cards from server to drop stale zone badges
    const res = await fetch("/api/cards");
    cards = await res.json();
    renderCards();
  }

  // ── Utility ───────────────────────────────────────────────────────────────
  function esc(s) {
    if (s == null) return "";
    return String(s)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  // ── Bootstrap ─────────────────────────────────────────────────────────────
  load();

  return {
    setZone, openScan, closeScan, openZones, closeZones,
    toggleCalled, removeCard, addZone,
    _onFile, _showScanPicker: showScanPicker, _commitCards, _delZone,
  };
})();
</script>
</body>
</html>
